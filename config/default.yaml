source:
  type: file
  path: null
  width: 1280
  height: 720
  fps: 60
  loop: false
models:
  players:
    backend: onnxruntime
    path: models/players.onnx
    input_size: 640
    confidence: 0.35
    app:  # players[].app appearance vector (CONTRACTS.md)
      method: chest_color  # chest_color now; a re-ID model later
      length: 16  # fixed vector length: (length - 2) hue bins + dark and light fractions
      chest_box: [0.28, 0.18, 0.72, 0.42]  # x1, y1, x2, y2 as fractions of the person bbox
      # HSV low/high (OpenCV ranges) of the court floor, removed before colour stats.
      # Prototype value only; needs calibration on the real court.
      floor_hsv: [[100, 120, 90], [125, 255, 255]]
      achromatic_s_max: 60  # pixels at or below this saturation count as dark or light, not hue
      dark_v_max: 75  # achromatic pixels at or below this value count as dark
  shuttle:
    backend: onnxruntime
    path: models/shuttle.onnx
    endpoint: ipc:///tmp/hud_shuttle
    confidence_threshold: 0.45
    morph_kernel_size: 3
    min_contour_area: 5.0
    max_contour_area: 120.0
    max_gap: 2
    background_sample_count: 30
    background_update_interval_s: 30.0
bus:
  name: hud_frames
  slots: 4
workers:
  players:
    enabled: true
    command: [python, -m, hud.workers.players]
  shuttle:
    enabled: true
    command: [python, -m, hud.workers.shuttle]
  audio:
    enabled: false
    command: [python, -m, hud.workers.audio]
    sample_rate: 44100  # Hz
    chunk_size: 1024  # samples per input callback
    offset_ms: 0.0  # added to hit ts to align mic latency with video
    low_freq: 2000.0  # band-pass low edge (Hz); racket hits sit in 2-8 kHz (LESSONS)
    high_freq: 8000.0  # band-pass high edge (Hz)
    refractory_ms: 150.0  # ignore further onsets this long after a hit
    sensitivity: 3.5  # onset threshold as a multiple of the adaptive noise floor
    queue_chunks: 8  # audio chunks buffered between callback and main thread
supervisor:
  heartbeat_timeout_s: 3
  poll_interval_s: 0.25
  startup_grace_s: 30  # seconds a fresh worker may load (e.g. a model) before its first heartbeat
fusion:
  identity:
    app_window_frames: 90   # ~±45 frames per LESSONS §4; past frames only
    app_weight_m: 2.0       # metres of cost per unit L1 appearance distance; not tuned
    side_mismatch_cost: 100 # larger than any court distance + appearance term
  rally:
    end_gap_ms: 1800        # LESSONS §6
    shot_match_window_ms: 100
    shot_refractory_ms: 200
  shuttle:
    max_px_per_s: null      # jump filter off until measured on real clips (needs measurement)
server:
  ws_port: 8765
  http_port: 8080
recording:
  directory: recordings
  ffmpeg: ffmpeg
  min_free_gb: 5
  segment_seconds: 1800
  disk_check_interval_s: 5
  disk_retry_interval_s: 5
  state_queue_size: 2048
