source:
  type: file
  path: null
  width: 1280
  height: 720
  fps: 60
  loop: false
models:
  players:
    backend: onnxruntime
    path: models/players.onnx
    input_size: 640
    confidence: 0.35
  shuttle:
    backend: onnxruntime
    path: models/shuttle.onnx
    width: 512
    height: 288
    confidence: 0.5
bus:
  name: hud_frames
  slots: 4
workers:
  players:
    enabled: true
    command: [python, -m, hud.workers.players]
  shuttle:
    enabled: true
    command: [python, -m, hud.workers.shuttle]
  audio:
    enabled: false
    command: [python, -m, hud.workers.audio]
supervisor:
  heartbeat_timeout_s: 3
  poll_interval_s: 0.25
server:
  ws_port: 8765
  http_port: 8080
recording:
  directory: recordings
  ffmpeg: ffmpeg
  min_free_gb: 5
  segment_seconds: 1800
  disk_check_interval_s: 5
  disk_retry_interval_s: 5
  state_queue_size: 2048
